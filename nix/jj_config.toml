"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[ui]
editor = "vim"

[merge-tools.patch-vim]
program = "jj-patch-vim"
edit-args = ["$left", "$right"]

[merge-tools.vimdiff]
program = "vimdiff"
merge-args = ["$base", "$left", "$right", "$output"]
merge-tool-edits-conflict-markers = true

